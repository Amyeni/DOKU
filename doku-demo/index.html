function lineChart(values,labels,{target,color,unit,min,max}){
 const w=560,h=200,l=45,t=22,b=32,r=22, bottom=h-b;
 const scale=v=>bottom-(v-min)/(max-min)*(bottom-t);
 const xs=values.map((_,i)=>l+i*(w-l-r)/(values.length-1));
 const points=values.map((v,i)=>xs[i]+','+scale(v));
 const levels=[min,(min+max)/2,max];
 const goal=target===undefined?'':`<line x1="${l}" y1="${scale(target)}" x2="${w-r}" y2="${scale(target)}" stroke="#bd7641" stroke-dasharray="4 4"/>`;
 return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(labels.map((d,i)=>d+' '+fmt(values[i])+unit).join(', '))}">${levels.map(v=>`<line x1="${l}" x2="${w-r}" y1="${scale(v)}" y2="${scale(v)}" stroke="#e5e9ee"/><text x="${l-7}" y="${scale(v)+4}" text-anchor="end">${fmt(v)}</text>`).join('')}${goal}<polygon points="${xs[0]},${bottom} ${points.join(' ')} ${xs.at(-1)},${bottom}" fill="${color}" opacity=".07"/><polyline points="${points.join(' ')}" fill="none" stroke="${color}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>${values.map((v,i)=>`<circle cx="${xs[i]}" cy="${scale(v)}" r="4.5" fill="white" stroke="${color}" stroke-width="2.5"><title>${labels[i]} · ${fmt(v)} ${unit}</title></circle><text x="${xs[i]}" y="${h-9}" text-anchor="middle">${labels[i]}</text>`).join('')}</svg>`;
}

 const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='DOKU_Oturum_Kanitlari.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),800);
}
function render(){
 if(view==='work'&&!active())view='home';store();const screens={home,work,context:foundation,history,evidence:ledger};
 $('app').innerHTML=`<div class="layout">${sidebar()}${mobileNav?'<button data-a="menu" class="scrim" aria-label="Menüyü kapat"></button>':''}<main>${topbar()}<div class="canvas">${screens[view]()}<footer><span>DOKU / DataOps Studio</span><span>Sentetik veri · Tarayıcıda çalışan demo${storageOk?'':' · Kalıcı kayıt kullanılamıyor'}</span></footer></div></main></div>`;
}
const actions={
 menu(){mobileNav=!mobileNav;render()},cancel:close,compose(){compose()},'start-discover'(){startSample('DISCOVER')},
 'fill'(b){const k=b.dataset.kind;$('request-text').value=k==='MONTHLY'?E.monthly:E.nextText(db,k);$('request-text').focus();$('request-feedback').innerHTML='';clarification=null},
 same(){start(clarification,'same')},separate(){start(clarification,'new')},'sessions'(){go('history')},'new-session'(){E.newSession(db);go('home');toast('Yeni oturum açıldı.');},
 tour(){modal('Örnek oturumu aç',`<p>Discover, Build, Consume, Improve ve Audit adımlarını ayrı bir demo oturumunda çalıştırır. Sohbet girdileri ve rol onayları örnek değerlerle verilir. Sonuçta canlı veri ürününün panosu açılır.</p>${notice('İkinci talep','Aylık pazarlama raporu aynı session içinde yeni Lifecycle ID alır. Kaynağı önceki üründür.')}<div class="actions">${button('play-tour','Örnek oturumu çalıştır','primary')}${button('cancel','Vazgeç','quiet')}</div>`)},
 'play-tour'(){E.runExample(db);go('work');toast('Örnek oturum tamamlandı. Talep geçmişinden her grubu açabilirsin.')},
 next(){const g=active(),i=g.plan.steps.indexOf(g.page);if(E.ready(g,g.page)&&g.plan.steps[i+1])pageMove(g.plan.steps[i+1])},
 'to-chat'(){document.getElementById('chat-panel')?.scrollIntoView({block:'center'})},
 'sample-answer'(){const g=active(),x=E.pending(g),k=x.fields.find(k=>!g.context[k]);$('answer').value=E.fields[k].sample;$('answer').focus()},
 'as-role'(){role=E.pending(active()).approval;render();$('chat-panel')?.scrollIntoView({block:'center'})},
 approve(){const g=active();E.decide(db,g,E.pending(g).id,role,true);render();toast('Onay kaydedildi. Servis sonucu ve kanıtı hazır.')},
 reject(){const g=active(),x=E.pending(g);E.decide(db,g,x.id,role,false);for(const key of x.fields)delete g.context[key];render();toast('İstek düzeltmeye döndü. Servis çalıştırılmadı.')},
 'page-context'(){const g=active();modal(pageName(g.page)+' · Lifecycle Context',factsList([...E.factsOnPage(db,g,g.page)].reverse()))},
 architecture,export:download
};
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 try{
  if(b.dataset.view)return go(b.dataset.view);
  if(b.dataset.group){E.selectGroup(db,b.dataset.group);return go('work')}
  if(b.dataset.page)return pageMove(b.dataset.page);
  if(b.dataset.sample)return startSample(b.dataset.sample);
  if(b.dataset.ev)return evidenceDetails(b.dataset.ev);
  if(b.dataset.fact)return factDetails(b.dataset.fact);
  if(b.dataset.svc)return contract(b.dataset.svc);
  if(b.dataset.session){db.activeSession=b.dataset.session;return go('home')}
  if(b.dataset.a)actions[b.dataset.a]?.(b);
 }catch(err){toast(err.message)}
});
document.addEventListener('submit',e=>{
 if(e.target.id==='request-form'){e.preventDefault();start($('request-text').value.trim());return}
 if(e.target.id==='answer-form'){
  e.preventDefault();const g=active(),x=E.pending(g),k=x.fields.find(f=>!g.context[f]);if(!k)return;
  try{E.input(g,x.id,k,$('answer').value);render();if($('answer'))$('answer').focus();else $('chat-panel')?.scrollIntoView({block:'center'})}catch(err){toast(err.message)}
 }
});
document.addEventListener('change',e=>{if(e.target.id==='role'){role=e.target.value;render()}});
$('dialog').addEventListener('click',e=>{if(e.target===$('dialog'))close()});
window.addEventListener('storage',e=>{if(e.key!==storage||!e.newValue)return;try{const updated=JSON.parse(e.newValue);if(updated.schema===4){db=updated;previewPage=null;close();render()}}catch{}});
if(location.hash==='#journeys')view='home';render();
})();
</script></body></html>
